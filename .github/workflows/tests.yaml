name: Tests

on:
  push:
    branches: ["shopify-tests"]
  pull_request:
    branches: ["shopify-tests"]

env:
  APP_NAME: "Musora Web Platform"
  APP_ENV: local
  APP_KEY: base64:wvzEaUzwx/M/xIlIiZ9p1P6kWmC6cHsIqoQzFhHIWps=
  APP_DEBUG: false
  DEBUGBAR_ENABLED: false
  APP_URL: http://localhost
  LOG_LEVEL: warning
  RAILTRACKER_ENABLED: false

jobs:
  laravel-tests:

    runs-on:
      group: Default Larger Runners
      labels: ubuntu-latest-16-cores

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/checkout@v3

      - name: Add HTTP basic auth credentials
        run: echo '${{ secrets.COMPOSER_AUTH_JSON }}' > $GITHUB_WORKSPACE/auth.json

      - name: Create .env
        run: php -r "file_exists('.env') || file_put_contents('.env', '');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/testing.sqlite

      - name: Execute tests via artisan command
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --parallel
