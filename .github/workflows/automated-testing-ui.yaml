name: Automated UI Testing

on:
  push:
    branches: [ "feature-dusk-rwillems20230127" ]

env:
  APP_NAME: "Musora Web Platform"
  APP_ENV: local
  APP_KEY: base64:wvzEaUzwx/M/xIlIiZ9p1P6kWmC6cHsIqoQzFhHIWps=
  APP_DEBUG: false
  DEBUGBAR_ENABLED: false
  APP_URL: https://pre-production.musora.com/
  LOG_LEVEL: warning
  RAILTRACKER_ENABLED: false
jobs:
  laravel-tests:

    runs-on:
      group: Default Larger Runners
      labels: ubuntu-latest-16-cores

    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: 8.1
          tools: composer:v2
          coverage: none
      - uses: actions/checkout@v3
      - name: Add HTTP basic auth credentials
        run: echo '${{ secrets.COMPOSER_AUTH_JSON }}' > $GITHUB_WORKSPACE/auth.json
      - name: Create .env
        run: php -r "file_exists('.env') || file_put_contents('.env', '');"
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Upgrade Chrome Driver
        run: php artisan dusk:chrome-driver --detect
      - name: Start Chrome Driver
        run: ./vendor/laravel/dusk/bin/chromedriver-linux &
      - name: Run Dusk Tests
        run: php artisan dusk
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v2
        with:
          name: screenshots
          path: tests/Browser/screenshots
      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v2
        with:
          name: console
          path: tests/Browser/console
