id: 31058
name: musora-web-platform
environments:
    production:
        domain:
            - 'musora.com'
            - 'production.musora.com'
        runtime: docker
        gateway-version: 2
        memory: 1728
        cli-memory: 1728
        cli-timeout: 900
        timeout: 120
        tmp-storage: 2048
        cli-tmp-storage: 2048
        queue-tmp-storage: 2048
        cache: musora-production-redis-cache
        build:
            - 'COMPOSER_MIRROR_PATH_REPOS=1 composer install --no-dev'
            - 'php artisan event:cache'
            - 'php artisan route:cache'
            - 'php artisan view:cache'
            - 'rm -rf node_modules && yarn install --frozen-lockfile && yarn platform-production && yarn marketing-production'
    pre-production:
        domain: 'pre-production.musora.com'
        scheduler: false
        runtime: docker
        gateway-version: 2
