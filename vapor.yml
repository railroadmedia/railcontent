id: 31058
name: musora-web-platform
environments:
    production:
        domain:
            - 'musora.com'
            - 'drumeo.com'
            - 'pianote.com'
            - 'guitareo.com'
            - 'singeo.com'
            - 'production.musora.com'
            - 'production.drumeo.com'
            - 'production.pianote.com'
            - 'production.guitareo.com'
            - 'production.singeo.com'
        runtime: docker
        gateway-version: 2
        memory: 1024
        cli-memory: 1024
        cli-timeout: 900
        timeout: 120
        tmp-storage: 1024
        cli-tmp-storage: 1024
        queue-tmp-storage: 1024
        queue-concurrency: 30
        cache: musora-production-redis-cache
        build:
            - 'COMPOSER_MIRROR_PATH_REPOS=1 composer install --no-dev'
            - 'php artisan event:cache'
            - 'php artisan route:cache'
            - 'php artisan view:cache'
            - 'rm -rf public/mix-manifest.json && yarn install --frozen-lockfile && yarn platform-production && yarn marketing-production && rm -rf node_modules'
        deploy:
            - 'php artisan migrate --force'
    pre-production: # deploys the master branch
        domain:
            - 'pre-production.musora.com'
            - 'pre-production.drumeo.com'
            - 'pre-production.pianote.com'
            - 'pre-production.guitareo.com'
            - 'pre-production.singeo.com'
        scheduler: false
        runtime: docker
        gateway-version: 2
        memory: 1728
        cli-memory: 1728
        cli-timeout: 900
        timeout: 120
        tmp-storage: 2048
        cli-tmp-storage: 2048
