opcache.enable_cli=0
opcache.enable=0
log_limit=1000000
log_errors_max_len=1000000
zend.exception_string_param_max_len=1000000
zend.assertions=-1
zend.detect_unicode=Off

extension=/opt/bref/extensions/blackfire.so
blackfire.agent_socket=tcp://ip-10-0-0-12.us-east-2.compute.internal:8307
blackfire.agent_timeout=0.25

date.timezone=UTC
display_startup_errors=off
max_input_time=60
memory_limit=256M
opcache.enable_file_override=1
opcache.validate_timestamps=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=164
opcache.max_accelerated_files=165407
opcache.revalidate_freq=5
session.use_strict_mode=On
short_open_tag=off
realpath_cache_ttl=3600
session.gc_probability=0
